<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf5f2">
  <title>Codex Auth 导出</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="sidepanel">
  <main class="shell" aria-label="Codex Auth 导出">
    <section class="panel hero-panel">
      <div class="hero">
        <div class="brand">
          <img src="icon48.png" width="48" height="48" alt="" class="logo" decoding="async">
          <div>
            <p class="eyebrow" translate="no">Codex Auth Exporter</p>
            <h1>认证导出</h1>
          </div>
        </div>
        <span id="statusBadge" class="badge badge-checking" role="status" aria-live="polite">检测中</span>
      </div>

      <p id="message" class="message">正在检测当前浏览器的 ChatGPT 登录状态…</p>

      <section id="details" class="details" hidden>
        <div class="row">
          <span class="label">名称</span>
          <span id="name" class="value">未返回</span>
        </div>
        <div class="row">
          <span class="label">邮箱</span>
          <span id="email" class="value">未返回</span>
        </div>
        <div class="row">
          <span class="label">套餐类型</span>
          <span id="planType" class="value">未返回</span>
        </div>
      </section>

      <div class="actions">
        <button id="refresh" type="button">刷新状态</button>
        <button id="copySession" class="secondary-button" type="button" aria-label="复制完整 session">复制 Session</button>
        <a class="secondary" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">打开 ChatGPT</a>
      </div>
    </section>

    <section class="panel json-card">
      <div class="section-title">
        <div>
          <p class="eyebrow compact" translate="no">Export</p>
          <h2 translate="no">auth.json</h2>
        </div>
        <button id="copyAuthJson" class="ghost" type="button" aria-label="复制 auth.json">复制</button>
      </div>
      <pre id="authJson" class="json-preview" translate="no">正在生成 JSON…</pre>
      <p id="copyStatus" class="copy-status" role="status" aria-live="polite"></p>
    </section>

    <footer>
      <span id="checkedAt">尚未完成检测</span>
      <span>Side Panel</span>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
